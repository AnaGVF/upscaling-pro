<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="prismBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>
    <linearGradient id="edgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="gemReflect" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.4" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container with subtle border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#prismBg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Ultra-HD Diamond/Prism facets (representing crystal-clear super-resolution) -->
  <polygon points="32,10 50,22 50,42 32,54 14,42 14,22" fill="none" stroke="url(#edgeGrad)" stroke-width="2.2" stroke-linejoin="round" />
  
  <!-- Inner geometric crystal reflections -->
  <polygon points="32,10 32,32 50,22" fill="url(#gemReflect)" opacity="0.6" />
  <polygon points="32,32 50,42 32,54" fill="#38bdf8" opacity="0.25" />
  <polygon points="14,22 32,32 14,42" fill="#818cf8" opacity="0.35" />
  <polygon points="14,22 32,10 32,32" fill="#c084fc" opacity="0.5" />

  <!-- Central Super-Resolution Core Star -->
  <path d="M32 23 C32 28, 27 32, 22 32 C 27 32, 32 36, 32 41 C 32 36, 37 32, 42 32 C 37 32, 32 28, 32 23 Z"
        fill="#ffffff" filter="url(#subtleGlow)" />
</svg>
